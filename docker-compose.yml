services:
  translation-service:
    build:
      context: ./translation-service-poc
      args:
        DEBIAN_MIRROR_HOST: "${TRANSLATION_DEBIAN_MIRROR_HOST:-deb.debian.org}"
        PYPI_INDEX_URL: "${TRANSLATION_PYPI_INDEX_URL:-https://pypi.org/simple}"
    container_name: jm-translation
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    cpus: "${TRANSLATION_CPU_LIMIT:-2.0}"
    mem_limit: "${TRANSLATION_MEMORY_LIMIT:-2g}"
    pids_limit: "${TRANSLATION_PIDS_LIMIT:-256}"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m
    volumes:
      - translation-cache:/app/cache
    environment:
      TRANSLATION_CACHE_DIR: /app/cache
      TRANSLATION_WORKERS: "${TRANSLATION_WORKERS:-2}"
      TRANSLATION_MAX_INFLIGHT: "${TRANSLATION_MAX_INFLIGHT:-8}"
      TRANSLATION_MAX_UPLOAD_BYTES: "${TRANSLATION_MAX_UPLOAD_BYTES:-26214400}"
      TRANSLATION_MAX_PIXELS: "${TRANSLATION_MAX_PIXELS:-20000000}"
      TRANSLATION_INLINE_WAIT_MS: "${TRANSLATION_INLINE_WAIT_MS:-1800}"
      TRANSLATION_JOB_TTL_SECONDS: "${TRANSLATION_JOB_TTL_SECONDS:-3600}"
      TRANSLATION_RESULT_MAX_AGE_SECONDS: "${TRANSLATION_RESULT_MAX_AGE_SECONDS:-86400}"
      TRANSLATION_WEBP_METHOD: "${TRANSLATION_WEBP_METHOD:-2}"
      TRANSLATION_WEBP_QUALITY: "${TRANSLATION_WEBP_QUALITY:-92}"
      TRANSLATION_WARMUP: "${TRANSLATION_WARMUP:-1}"
      TRANSLATION_USE_CUDA: "${TRANSLATION_USE_CUDA:-0}"
      TRANSLATION_SERVICE_TOKEN: "${TRANSLATION_SERVICE_TOKEN:-}"
      TRANSLATION_FONT: "${TRANSLATION_FONT:-}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8091/healthz', timeout=2); raise SystemExit(0 if r.status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "${TRANSLATION_LOG_MAX_SIZE:-10m}"
        max-file: "${TRANSLATION_LOG_MAX_FILE:-3}"

  jm-web:
    build:
      context: .
      args:
        # 默认锁定 Node/Alpine 补丁版本；生产 CI 可覆盖为已核验的同标签 digest。
        NODE_IMAGE: "${JMW_NODE_IMAGE:-node:22.23.2-alpine3.24}"
    container_name: jm-web
    init: true
    user: "1000:1000"
    restart: unless-stopped
    stop_grace_period: 10s
    cpus: "${JMW_CPU_LIMIT:-1.0}"
    mem_limit: "${JMW_MEMORY_LIMIT:-512m}"
    pids_limit: "${JMW_PIDS_LIMIT:-256}"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      translation-service:
        condition: service_healthy
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    logging:
      driver: json-file
      options:
        max-size: "${JMW_LOG_MAX_SIZE:-10m}"
        max-file: "${JMW_LOG_MAX_FILE:-3}"
    ports:
      - target: ${PORT:-3210}
        published: "${JMW_PUBLISH_PORT:-3210}"
        host_ip: "${JMW_PUBLISH_HOST:-127.0.0.1}"
        protocol: tcp
    environment:
      # 容器内必须监听所有接口；宿主机暴露范围由 JMW_PUBLISH_HOST 单独控制。
      PORT: "${PORT:-3210}"
      HOST: "0.0.0.0"
      ACCESS_PASSWORD: "${ACCESS_PASSWORD:-}"
      JM_API_BASE: "${JM_API_BASE:-}"
      JM_UA: "${JM_UA:-okhttp/4.9.3}"
      JM_TIMEOUT: "${JM_TIMEOUT:-20000}"
      JM_TOTAL_TIMEOUT: "${JM_TOTAL_TIMEOUT:-35000}"
      JMW_DATA_DIR: "/app/data"
      JMW_MAX_CHAPTER_IMAGES: "${JMW_MAX_CHAPTER_IMAGES:-2000}"
      JMW_MAX_IMAGE_BYTES: "${JMW_MAX_IMAGE_BYTES:-26214400}"
      JMW_MAX_IMAGE_CONCURRENCY: "${JMW_MAX_IMAGE_CONCURRENCY:-12}"
      JMW_MAX_IMAGE_CONCURRENCY_PER_IP: "${JMW_MAX_IMAGE_CONCURRENCY_PER_IP:-6}"
      JMW_IMAGE_CACHE_BYTES: "${JMW_IMAGE_CACHE_BYTES:-67108864}"
      JMW_IMAGE_CACHE_ENTRY_BYTES: "${JMW_IMAGE_CACHE_ENTRY_BYTES:-2097152}"
      JMW_IMAGE_CACHE_TTL: "${JMW_IMAGE_CACHE_TTL:-86400}"
      JMW_IMAGE_QUEUE_LIMIT: "${JMW_IMAGE_QUEUE_LIMIT:-96}"
      JMW_IMAGE_QUEUE_TIMEOUT: "${JMW_IMAGE_QUEUE_TIMEOUT:-3000}"
      TRANSLATION_SERVICE_URL: "${TRANSLATION_SERVICE_URL-http://translation-service:8091}"
      TRANSLATION_SERVICE_TOKEN: "${TRANSLATION_SERVICE_TOKEN:-}"
      TRANSLATION_MAX_PAGE_BYTES: "${TRANSLATION_MAX_PAGE_BYTES:-26214400}"
      JMW_MAX_API_RESPONSE_BYTES: "${JMW_MAX_API_RESPONSE_BYTES:-16777216}"
      JMW_MAX_AI_STREAM_BYTES: "${JMW_MAX_AI_STREAM_BYTES:-16777216}"
      JMW_MAX_AI_CONCURRENCY: "${JMW_MAX_AI_CONCURRENCY:-4}"
      JMW_MAX_SEARCH_CONCURRENCY: "${JMW_MAX_SEARCH_CONCURRENCY:-8}"
      JMW_TRUST_PROXY: "${JMW_TRUST_PROXY:-}"
      AI_API_KEY: "${AI_API_KEY:-}"
      AI_BASE_URL: "${AI_BASE_URL:-https://newapi.shixian.me/v1}"
      AI_MODEL: "${AI_MODEL:-grok-4.6}"
      AI_TIMEOUT: "${AI_TIMEOUT:-120000}"
      CHAPTER_AI_INTERVAL_MS: "${CHAPTER_AI_INTERVAL_MS:-30000}"
      CHAPTER_AI_CONCURRENCY: "${CHAPTER_AI_CONCURRENCY:-1}"
      CHAPTER_AI_MAX_RETRIES: "${CHAPTER_AI_MAX_RETRIES:-3}"
      TAVILY_API_KEY: "${TAVILY_API_KEY:-}"
      SEARXNG_BASE_URL: "${SEARXNG_BASE_URL:-}"
      SEARCH_TIMEOUT: "${SEARCH_TIMEOUT:-35000}"
      JMW_UPDATE_REPO: "${JMW_UPDATE_REPO:-}"
    volumes:
      - type: bind
        source: "${JMW_HOST_DATA_DIR:-./data}"
        target: /app/data
        bind:
          # 禁止 Docker 以 root 静默创建宿主机目录，避免非 root 应用启动后才报权限错误。
          create_host_path: false

volumes:
  translation-cache:
